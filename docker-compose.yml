name: ai-customer-platform

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_platform
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_platform
    # Host port defaults to 5433 so it does not clash with a locally installed PostgreSQL.
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    # Must come back with Docker like the app containers do; otherwise they restart alone after a
    # reboot and crash-loop on "No address associated with hostname" (postgres / redis not running).
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_platform"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    ports: ["8000:8000"]

  support-worker:
    <<: *backend
    command: ["python", "-m", "app.workers.support_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_platform
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      WORKER_ID: support-worker
    depends_on: [api]

  call-worker:
    <<: *backend
    command: ["python", "-m", "app.workers.call_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_platform
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      WORKER_ID: call-worker
    depends_on: [api]

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on: [api]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  storage:
