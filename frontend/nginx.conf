server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Built JS/CSS have content hashes in their names: cache forever, and never fall back to
  # index.html (serving HTML for a missing script after a rebuild is what causes a blank page).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths go to index.html so client-side routes work on refresh.
  # index.html itself is never cached, so a rebuild is picked up on the next page load.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
